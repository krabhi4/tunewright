[workspace]
resolver = "2"
members = [
    "crates/tunewright-core",
    "crates/tunewright-lookup",
    "crates/tunewright-server",
]

[workspace.package]
version = "1.0.2"
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
description = "A self-hosted web application for editing audio file metadata"
repository = "https://github.com/krabhi4/tunewright"
homepage = "https://github.com/krabhi4/tunewright"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rayon = "1.12"
hex = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
