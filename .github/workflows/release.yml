name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify version matches git tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          CLEAN_TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(awk -F '"' '/^\[/{f=($0=="[workspace.package]")} f && /^version *=/{print $2; exit}' Cargo.toml)
          FRONTEND_VERSION=$(jq -r .version frontend/package.json)
          echo "Git tag version: $CLEAN_TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "frontend/package.json version: $FRONTEND_VERSION"
          if [ "$CLEAN_TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Git tag version ($CLEAN_TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          if [ "$CLEAN_TAG_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "Error: Git tag version ($CLEAN_TAG_VERSION) does not match frontend/package.json version ($FRONTEND_VERSION)"
            exit 1
          fi

  docker:
    needs: verify-version
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest
      cache: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
